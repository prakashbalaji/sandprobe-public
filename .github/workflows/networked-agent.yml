name: Networked-agent evaluation
on:
  pull_request:
    paths:
      - experiments/eks-agent/**
      - deploy/canary.sh
      - deploy/canary-health/**
      - cmd/sandprobe-agent-grade/**
      - internal/host/agent_nitro*
      - internal/host/agent_persistent*
      - internal/host/agent_workspace*
      - internal/host/agent_reset_job*
      - internal/host/workload_artifact.py
      - internal/host/workload_environment*
      - deploy/workload_environment.py
      - deploy/eks.sh
      - deploy/durable_state.py
      - deploy/canary_outcome.py
      - .github/workflows/networked-agent.yml
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.25.14'
      - name: Test render and model-response validation with stub SDK replies
        run: |
          python3 -m venv /tmp/agent-test-env
          /tmp/agent-test-env/bin/pip install --require-hashes -r experiments/eks-agent/requirements.lock
          /tmp/agent-test-env/bin/python -m unittest discover -s experiments/eks-agent -p 'test_*.py'
      - name: Build pinned task image locally
        run: docker build -t sandprobe-agent-local experiments/eks-agent
      - name: Exercise production task with explicit stub in a network-disabled container
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --memory 256m --cpus 1 \
            --tmpfs /workspace:rw,uid=10001,gid=10001,mode=0700,size=64m \
            --tmpfs /tmp:rw,uid=10001,gid=10001,mode=0700,size=64m \
            --mount type=bind,src="$PWD/experiments/eks-agent/container_smoke.py",dst=/checks/smoke.py,readonly \
            --mount type=bind,src="$PWD/experiments/eks-agent/fixtures/solution.py",dst=/checks/solution.py,readonly \
            --entrypoint python sandprobe-agent-local -I /checks/smoke.py
      - name: Execute allowed/isolated receiver calibration with immutable-ID cleanup
        run: python3 experiments/eks-agent/container_network_test.py
      - name: Exercise the shared clean environment with an inherited synthetic credential
        run: python3 experiments/eks-agent/container_environment_test.py
      - name: Exercise delegated EKS lifecycle with durable state and fake AWS
        run: DURABLE_STATE=1 bash deploy/eks_test.sh
      - name: Exercise standard canary cleanup
        run: DURABLE_STATE=1 bash deploy/canary_test.sh
      - name: Export and verify the tested image archive
        run: python3 experiments/eks-agent/image_artifact.py create "$RUNNER_TEMP/sandprobe-image" "$GITHUB_SHA" "$GITHUB_RUN_ATTEMPT"
      - name: Retain the verified main image for daemonless evaluations
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sandprobe-agent-image-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sandprobe-image/
          if-no-files-found: error
          retention-days: 1
          compression-level: 1
