name: Provider request
description: Ask for Sandprobe to support a sandbox provider.
title: "Provider: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Any box with a shell already works with `sandprobe run exec`. A native adapter adds a throwaway box per run, created and deleted through the provider's API.

        Every adapter starts from the provider's terms (PRV-5 in [SPEC.md](https://github.com/summationai/sandprobe/blob/main/SPEC.md)): we read its security-research, bug-bounty, penetration-testing and acceptable-use terms, and skip the checks they rule out. A provider whose terms require written consent waits until that consent is recorded.
  - type: input
    id: provider
    attributes:
      label: Provider
      placeholder: Example Sandboxes
    validations:
      required: true
  - type: input
    id: docs
    attributes:
      label: Its sandbox API docs
      description: A link to how boxes are created, reached and deleted.
    validations:
      required: true
  - type: textarea
    id: terms
    attributes:
      label: Its terms
      description: Links to its security-research, bug-bounty, penetration-testing and acceptable-use terms, and anything they say about customers testing their own sandboxes.
    validations:
      required: true
  - type: dropdown
    id: identity
    attributes:
      label: How does its API address a box?
      description: Sandprobe deletes a box by the ID its create returned. A provider that addresses boxes only by name needs a reviewed exception.
      options:
        - By an ID the create returns
        - By name only
        - I don't know
    validations:
      required: true
  - type: textarea
    id: use
    attributes:
      label: What you'd use it for
      description: How your agents run there, and what you want to know about the box.
  - type: checkboxes
    id: confirm
    attributes:
      label: Before you submit
      options:
        - label: I've read the provider's terms linked above.
          required: true
